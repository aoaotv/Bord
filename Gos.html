<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GPS Acceleration Meter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        h1 { font-size: 1.1rem; margin-bottom: 5px; color: #8b949e; }
        p.sub { font-size: 0.8rem; color: #8b949e; margin-bottom: 20px; }
        #permission-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 40px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }
        /* 1つの大きなバーエリア（中央ゼロ） */
        .meter-container {
            width: 120px;
            height: 60vh;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }
        .center-line {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 2px;
            background: #8b949e;
            z-index: 2;
        }
        #bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 0%;
            transition: height 0.15s ease-out, top 0.15s ease-out, background-color 0.15s ease-out;
        }
        .label-area {
            display: flex;
            justify-content: space-between;
            width: 120px;
            margin: 5px auto;
            font-size: 0.85rem;
            font-weight: bold;
        }
        #debug {
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <h1>GPS 加速度メーター</h1>
    <p class="sub">GPSの速度変化からアクセル・ブレーキを検知</p>
    <button id="permission-btn">GPS計測を開始する</button>

    <div class="container" id="main-content" style="display: none;">
        <div class="label-area" style="color: #2ea043;">
            <span>▲ 加速 (Accel)</span>
        </div>
        <div class="meter-container">
            <div class="center-line"></div>
            <div id="bar"></div>
        </div>
        <div class="label-area" style="color: #f85149;">
            <span>▼ 減速 (Brake)</span>
        </div>
        <div id="debug">Speed: 0.0 km/h<br>Accel: 0.00</div>
    </div>

    <script>
        const btn = document.getElementById('permission-btn');
        const mainContent = document.getElementById('main-content');
        const debugDiv = document.getElementById('debug');
        const bar = document.getElementById('bar');

        let lastSpeed = null;
        let lastTime = null;

        btn.addEventListener('click', () => {
            if ('geolocation' in navigator) {
                btn.style.display = 'none';
                mainContent.style.display = 'flex';

                navigator.geolocation.watchPosition(
                    (position) => {
                        let currentSpeed = position.coords.speed; // 秒速 (m/s)
                        const currentTime = position.timestamp;

                        if (currentSpeed === null) {
                            currentSpeed = 0; // 取得できない場合のフォールバック
                        }

                        let speedKmh = (currentSpeed * 3.6).toFixed(1);

                        if (lastSpeed !== null && lastTime !== null) {
                            let timeDiff = (currentTime - lastTime) / 1000; // 秒
                            if (timeDiff > 0) {
                                // 加速度 (m/s^2) = 速度の変化量 ÷ 時間
                                let acceleration = (currentSpeed - lastSpeed) / timeDiff;

                                debugDiv.innerHTML = `Speed: ${speedKmh} km/h<br>Accel: ${acceleration.toFixed(2)}`;

                                // バーの長さに変換（感度調整）
                                let percent = Math.min(Math.abs(acceleration) * 25, 50);

                                if (acceleration > 0.05) {
                                    // 加速（上に緑のバー）
                                    bar.style.backgroundColor = '#238636';
                                    bar.style.top = (50 - percent) + '%';
                                    bar.style.height = percent + '%';
                                } else if (acceleration < -0.05) {
                                    // 減速（下に赤のバー）
                                    bar.style.backgroundColor = '#da3633';
                                    bar.style.top = '50%';
                                    bar.style.height = percent + '%';
                                } else {
                                    // 巡航・停止中（ゼロ）
                                    bar.style.height = '0%';
                                }
                            }
                        }

                        lastSpeed = currentSpeed;
                        lastTime = currentTime;
                    },
                    (error) => {
                        alert('GPSエラー: ' + error.message);
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 5000
                    }
                );
            } else {
                alert('このブラウザはGPSに対応していません');
            }
        });
    </script>
</body>
</html>
