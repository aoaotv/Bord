<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinzo マーケットボード</title>
<style>
:root{--bar:#080d18;--tk:#000;--bg:#05080f;--panel:#0d1422;--line:#1c2740;--tx:#e8eefc;--sub:#7f8fb0;--up:#ff4d5e;--down:#2ee6a0;--flat:#9aa7c7}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI","Hiragino Sans",Meiryo,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line);transition:.25s}
body.hideui #bar{display:none}
#bar button,#bar .chip{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
#bar button.on,#bar .chip.on{background:#1f4fd8;border-color:#3b6bff}
#bar .sp{flex:1}
#clock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
#ticker{background:var(--tk);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;height:34px;line-height:34px;font-size:15px}
#ticker .in{display:inline-block;padding-left:100%;animation:mq 45s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#view{flex:1;min-height:0;padding:12px;overflow:hidden}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.flash-up{animation:fu .6s}.flash-down{animation:fd .6s}
@keyframes fu{from{background:rgba(255,77,94,.45)}to{background:transparent}}
@keyframes fd{from{background:rgba(46,230,160,.4)}to{background:transparent}}
/* 電光掲示板 */
.board{display:grid;gap:8px;height:100%;grid-auto-rows:1fr}
.row{display:grid;grid-template-columns:2.2fr 1.2fr 1.1fr 2fr;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 18px;min-height:0}
.row .nm{font-size:clamp(16px,2.6vh,30px);font-weight:700}.row .nm small{display:block;color:var(--sub);font-size:.55em;font-weight:400}
.row .pr{font-size:clamp(24px,5vh,64px);text-align:right}
.row .ch{font-size:clamp(14px,2.4vh,28px);text-align:right}
.row canvas{width:100%;height:70%}
/* タイル */
.tiles{display:grid;gap:10px;height:100%}
.tile{border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;position:relative;overflow:hidden}
.tile .nm{font-size:clamp(14px,2.4vh,26px);font-weight:700}
.tile .pr{font-size:clamp(28px,7vh,90px);font-weight:800}
.tile .ch{font-size:clamp(14px,2.6vh,30px)}
.tile canvas{position:absolute;inset:auto 0 0 0;width:100%;height:45%;opacity:.5}
/* 大チャート */
.single{display:grid;grid-template-columns:230px 1fr;gap:12px;height:100%}
.side{display:flex;flex-direction:column;gap:6px;overflow:auto}
.side .it{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.side .it.sel{border-color:#3b6bff;background:#12204a}
.side .it .p{font-size:18px}
.main{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;min-width:0}
.main h2{margin:0;font-size:clamp(18px,3vh,34px)}
.main .big{font-size:clamp(40px,11vh,130px);font-weight:800;line-height:1.05}
.main .meta{display:flex;gap:28px;color:var(--sub);font-size:clamp(12px,1.8vh,18px);margin:6px 0 10px;flex-wrap:wrap}
.main .meta b{color:var(--tx)}
.main canvas{flex:1;min-height:0;width:100%}
@media(max-width:700px){.single{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row}.side .it{min-width:130px}.row{grid-template-columns:1.6fr 1fr 1fr;}.row canvas{display:none}}
html.blue{--bg:#0020c8;--panel:#0a2fe0;--line:#5470ff;--tx:#fff;--sub:#c3ceff;--up:#ff8593;--down:#7dffc0;--flat:#e3e9ff;--bar:#001590;--tk:#000f6e}
.focus{height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 28px;min-height:0}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fnm{font-size:clamp(20px,4vh,48px);font-weight:800}
.fnm small{color:var(--sub);font-size:.45em;font-weight:400;margin-left:10px}
.fnav button{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:6px 16px;font-size:clamp(14px,2.5vh,28px);cursor:pointer}
.fbig{font-size:clamp(56px,20vh,260px);font-weight:800;line-height:1.05}
.fchg{font-size:clamp(18px,4vh,48px);font-weight:700}
.focus canvas{flex:1;min-height:0;width:100%;margin-top:10px}
.fmeta{display:flex;gap:28px;flex-wrap:wrap;color:var(--sub);font-size:clamp(12px,2vh,22px);margin-top:8px}
.fmeta b{color:var(--tx)}
#msg{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:20px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <strong>📈 Sinzo マーケット</strong>
    <span id="lay"></span>
    <span class="sp"></span>
    <span id="sel"></span>
    <span id="clock"></span>
    <button id="blue">🟦 青画面</button>
    <button id="fs">⛶ 全画面</button>
    <button id="hide" title="操作バーを隠す（Hキーで再表示）">▲ 隠す</button>
  </div>
  <div id="ticker"><div class="in" id="tk"></div></div>
  <div id="view"></div>
</div>
<div id="msg">接続中...</div>

<script>
window.addEventListener("error",function(e){var t=document.getElementById("log")||document.getElementById("msg");if(t){t.style.display="block";t.textContent+="\n✖ エラー: "+(e.message||"読み込み失敗")+(e.filename?" ("+e.filename.split("/").pop()+":"+e.lineno+")":"");}});
window.addEventListener("unhandledrejection",function(e){var t=document.getElementById("log")||document.getElementById("msg");if(t){t.style.display="block";t.textContent+="\n✖ エラー: "+((e.reason&&e.reason.message)||e.reason);}});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction, Timestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyC9ygh6HjX5mK1e5ZBnEWnLQCEjRMKIEWA",
  authDomain: "sinzo-3f972.firebaseapp.com",
  databaseURL: "https://sinzo-3f972-default-rtdb.firebaseio.com",
  projectId: "sinzo-3f972",
  storageBucket: "sinzo-3f972.firebasestorage.app",
  messagingSenderId: "1058985227031",
  appId: "1:1058985227031:web:6b152911e917903910bd52"
});
const db = getFirestore(app);
const marketRef = doc(db, "market", "global");

// ===== 銘柄定義（本体 index.html と同一） =====
const STOCKS = [
  { id:"snz", name:"sinzo株式会社", emoji:"🏢", base:300, min:15, max:2500, vol:0.11, drift:0.002, revert:0.010, jump:{p:0.05,size:0.40} },
  { id:"snzb", name:"sinzobord", emoji:"📱", base:250, min:20, max:1500, vol:0.09, drift:0.0015, revert:0.012, jump:{p:0.04,size:0.35} },
  { id:"frbs", name:"firebase株式会社", emoji:"💻", base:200, min:70, max:500, vol:0.07, drift:0.001, revert:0.020 },
  { id:"szmt", name:"sinzomart", emoji:"🍙", base:150, min:90, max:260, vol:0.05, drift:0.0008, revert:0.030 },
  { id:"szdk", name:"sinzo電力", emoji:"💡", base:100, min:80, max:125, vol:0.04, drift:0.0003, revert:0.040 },
  { id:"szsh", name:"sinzo高校", emoji:"🏫", base:100, min:80, max:125, vol:0.03, drift:0.0003, revert:0.040 },
  { id:"szwt", name:"sinzowater", emoji:"💦", base:100, min:80, max:125, vol:0.02, drift:0.0003, revert:0.040 },
  { id:"szgs", name:"sinzoガス", emoji:"🔥", base:100, min:80, max:125, vol:0.015, drift:0.0003, revert:0.040 }
];
const TICK_MS = 1000, MAIN_MAX = 240, ARCH = 120, MAX_CATCHUP = 30;

// ===== 株価更新ロジック（本体と共通。どちらの画面が開いていても更新される） =====
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function stockParams(d, ov){
  if(!ov||!(ov.base>0))return d;
  const k=ov.base/d.base;
  return Object.assign({},d,{base:ov.base,min:Math.max(1,Math.min(d.min,Math.round(d.min*k),ov.base)),max:Math.max(d.max,Math.round(d.max*k),ov.base)});
}
function nextPrice(d, price){
  let lp=Math.log(Math.max(1,price)), shock=d.vol*randn();
  if(d.jump&&Math.random()<d.jump.p)shock+=(Math.random()<0.5?-1:1)*d.jump.size*(0.5+Math.random()*0.5);
  lp+=d.drift+d.revert*(Math.log(d.base)-lp)+shock;
  return Math.min(d.max,Math.max(d.min,Math.round(Math.exp(lp))));
}
const freshStock=d=>({p:d.base,h:[d.base],lo:d.base,hi:d.base});
function alignMarket(data, now){
  const stocks=data.stocks||{};
  STOCKS.forEach(d=>{if(!stocks[d.id])stocks[d.id]=freshStock(d);});
  let ts=Array.isArray(data.ts)?data.ts.slice():[],H=ts.length;
  STOCKS.forEach(d=>{H=Math.max(H,stocks[d.id].h.length);});
  if(ts.length!==H){const end=typeof data.tickAt==="number"?data.tickAt:now;ts=Array.from({length:H},(_,i)=>end-(H-1-i)*TICK_MS);}
  STOCKS.forEach(d=>{const h=stocks[d.id].h;while(h.length<H)h.unshift(h[0]);});
  return {stocks,ts,chunks:data.chunks||0,overrides:Object.assign({},data.overrides||{})};
}
function writeMarket(tx, m, now){
  while(m.ts.length>MAIN_MAX){
    const p={};STOCKS.forEach(d=>{p[d.id]=m.stocks[d.id].h.splice(0,ARCH);});
    tx.set(doc(db,"market","h_"+m.chunks),{n:m.chunks,ts:m.ts.splice(0,ARCH),p});
    m.chunks++;
  }
  tx.set(marketRef,{stocks:m.stocks,ts:m.ts,chunks:m.chunks,overrides:m.overrides||{},tickAt:now,updated_at:Timestamp.now()},{merge:true});
}
async function tickMarket(){
  if(document.hidden)return;
  try{
    await runTransaction(db,async tx=>{
      const snap=await tx.get(marketRef),data=snap.exists()?snap.data():{},now=Date.now();
      let last=typeof data.tickAt==="number"?data.tickAt:0;
      if(last>now+60000)last=now-TICK_MS;
      const needInit=!data.stocks||!Array.isArray(data.ts)||STOCKS.some(d=>!data.stocks[d.id]);
      if(!needInit&&now-last<TICK_MS-300)return;
      const m=alignMarket(data,now);
      const steps=data.stocks?Math.min(MAX_CATCHUP,Math.max(1,Math.floor((now-last)/TICK_MS))):0;
      for(let i=0;i<steps;i++){
        m.ts.push(now-(steps-1-i)*TICK_MS);
        STOCKS.forEach(d=>{const s=m.stocks[d.id];s.p=nextPrice(stockParams(d,m.overrides[d.id]),s.p);s.h.push(s.p);if(s.p<s.lo)s.lo=s.p;if(s.p>s.hi)s.hi=s.p;});
      }
      writeMarket(tx,m,now);
    });
  }catch(e){}
}
(function loop(){setTimeout(async()=>{await tickMarket();loop();},TICK_MS+Math.random()*1000);})();

// ===== 表示 =====
const $=id=>document.getElementById(id);
const LAYOUTS=[["board","📋 電光掲示板"],["tiles","🟥 ヒートマップ"],["single","📊 大チャート"],["focus","🎯 1銘柄集中"]];
let layout=localStorage.getItem("sb_layout")||"board";
let chosen=[];try{chosen=JSON.parse(localStorage.getItem("sb_sel")||"[]");}catch(e){}
chosen=chosen.filter(id=>STOCKS.some(s=>s.id===id));   // 旧IDが保存されていても無視する
if(!chosen.length)chosen=STOCKS.map(s=>s.id);
let focus=localStorage.getItem("sb_focus");
if(!chosen.includes(focus))focus=chosen[0];
let market=null,prevPrice={},lastRenderKey="";
const save=()=>{localStorage.setItem("sb_layout",layout);localStorage.setItem("sb_sel",JSON.stringify(chosen));localStorage.setItem("sb_focus",focus);};
const cls=v=>v>0?"up":v<0?"down":"flat";
const arrow=v=>v>0?"▲":v<0?"▼":"－";
const fmt=n=>Number(n).toLocaleString("ja-JP");

function buildBar(){
  $("lay").innerHTML=LAYOUTS.map(l=>`<button data-l="${l[0]}" class="${l[0]===layout?"on":""}">${l[1]}</button>`).join("");
  $("sel").innerHTML=STOCKS.map(s=>`<span class="chip ${chosen.includes(s.id)?"on":""}" data-s="${s.id}">${s.emoji} ${s.name}</span>`).join(" ");
}
$("lay").onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;layout=b.dataset.l;save();buildBar();lastRenderKey="";render();};
$("sel").onclick=e=>{const c=e.target.closest("[data-s]");if(!c)return;const id=c.dataset.s;
  if(chosen.includes(id)){if(chosen.length>1)chosen=chosen.filter(x=>x!==id);}else chosen=STOCKS.map(s=>s.id).filter(x=>chosen.includes(x)||x===id);
  if(!chosen.includes(focus))focus=chosen[0];save();buildBar();lastRenderKey="";render();};
$("fs").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});};
$("hide").onclick=()=>document.body.classList.add("hideui");
document.addEventListener("keydown",e=>{if(e.key==="h"||e.key==="H")document.body.classList.toggle("hideui");if(e.key==="f"||e.key==="F")$("fs").click();});
document.addEventListener("dblclick",()=>document.body.classList.toggle("hideui"));
setInterval(()=>{$("clock").textContent=new Date().toLocaleString("ja-JP",{hour12:false});},500);

// 折れ線描画
function drawLine(cv,arr,color,opt){
  opt=opt||{};const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;
  cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
  const g=cv.getContext("2d");g.scale(dpr,dpr);const W=r.width,H=r.height;
  if(!arr||arr.length<2)return;
  const padL=opt.axis?56:2,padB=opt.axis?4:2,padT=4;
  let lo=Math.min(...arr),hi=Math.max(...arr);if(hi===lo){hi+=1;lo-=1;}const pad=(hi-lo)*0.08;lo-=pad;hi+=pad;
  const X=i=>padL+(W-padL-2)*i/(arr.length-1),Y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
  if(opt.axis){g.font="12px sans-serif";const cs=getComputedStyle(document.documentElement);g.fillStyle=cs.getPropertyValue("--sub").trim()||"#7f8fb0";g.strokeStyle=cs.getPropertyValue("--line").trim()||"#1c2740";g.lineWidth=1;
    for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);g.beginPath();g.moveTo(padL,y);g.lineTo(W,y);g.stroke();g.fillText(Math.round(v),4,y+4);}}
  g.beginPath();arr.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));
  g.strokeStyle=color;g.lineWidth=opt.axis?2.5:2;g.lineJoin="round";g.stroke();
  g.lineTo(X(arr.length-1),H);g.lineTo(X(0),H);g.closePath();
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,color+"55");gr.addColorStop(1,color+"00");g.fillStyle=gr;g.fill();
  const lx=X(arr.length-1),ly=Y(arr[arr.length-1]);g.beginPath();g.arc(lx,ly,opt.axis?5:3,0,7);g.fillStyle=color;g.fill();
}
const colOf=v=>v>0?"#ff4d5e":v<0?"#2ee6a0":"#9aa7c7";
function info(d){
  const s=market[d.id],h=s.h,p=s.p,prev=h.length>1?h[h.length-2]:p,open=h[0];
  return {d,s,h,p,prev,open,tick:p-prev,diff:p-open,pct:open?(p-open)/open*100:0};
}
const sgn=(v,dg)=>(v>0?"+":"")+(dg?v.toFixed(dg):v);

function render(){
  if(!market)return;
  const list=STOCKS.filter(s=>chosen.includes(s.id)).map(info);
  // ティッカー
  $("tk").innerHTML=STOCKS.map(info).map(i=>`<span style="margin-right:36px">${i.d.emoji} ${i.d.name} <b class="${cls(i.diff)}">${fmt(i.p)}</b> <span class="${cls(i.diff)}">${arrow(i.diff)}${sgn(i.pct,2)}%</span></span>`).join("");
  const key=layout+"|"+chosen.join(",")+"|"+(layout==="single"?focus:"");
  const v=$("view");
  if(key!==lastRenderKey){
    lastRenderKey=key;
    if(layout==="board"){v.innerHTML=`<div class="board">${list.map(i=>`<div class="row" data-id="${i.d.id}"><div class="nm">${i.d.emoji} ${i.d.name}<small>${i.d.id.toUpperCase()}</small></div><div class="pr num"></div><div class="ch num"></div><canvas></canvas></div>`).join("")}</div>`;}
    else if(layout==="tiles"){const n=list.length,c=Math.ceil(Math.sqrt(n*(innerWidth/innerHeight)));v.innerHTML=`<div class="tiles" style="grid-template-columns:repeat(${Math.min(c,n)},1fr)">${list.map(i=>`<div class="tile" data-id="${i.d.id}"><div class="nm">${i.d.emoji} ${i.d.name}</div><div><div class="pr num"></div><div class="ch num"></div></div><canvas></canvas></div>`).join("")}</div>`;}
    else if(layout==="focus"){if(!chosen.includes(focus))focus=chosen[0];
      const d0=STOCKS.find(x=>x.id===focus)||STOCKS[0];
      v.innerHTML=`<div class="focus" data-id="${focus}"><div class="fhead"><div class="fnm">${d0.emoji} ${d0.name}<small>${d0.id.toUpperCase()}</small></div><div class="fnav"><button data-d="-1">◀</button> <button data-d="1">▶</button></div></div><div class="fbig num"></div><div class="fchg num"></div><canvas></canvas><div class="fmeta"></div></div>`;}
    else{if(!chosen.includes(focus))focus=chosen[0];
      v.innerHTML=`<div class="single"><div class="side">${list.map(i=>`<div class="it" data-id="${i.d.id}"><div>${i.d.emoji} ${i.d.name}</div><div class="p num"></div><div class="c"></div></div>`).join("")}</div><div class="main"><h2></h2><div class="big num"></div><div class="meta"></div><canvas></canvas></div></div>`;}
  }
  list.forEach(i=>{
    const el=v.querySelector(`[data-id="${i.d.id}"]`);if(!el)return;
    const c=cls(i.diff),old=prevPrice[i.d.id];
    if(layout==="board"){
      const pr=el.querySelector(".pr");pr.className="pr num "+c;pr.textContent=fmt(i.p);
      const ch=el.querySelector(".ch");ch.className="ch num "+c;ch.innerHTML=`${arrow(i.diff)} ${sgn(i.diff)}<br>${sgn(i.pct,2)}%`;
      drawLine(el.querySelector("canvas"),i.h,colOf(i.diff));
      if(old!=null&&old!==i.p){el.classList.remove("flash-up","flash-down");void el.offsetWidth;el.classList.add(i.p>old?"flash-up":"flash-down");}
    }else if(layout==="tiles"){
      const a=Math.min(.85,Math.abs(i.pct)/6+.18),rgb=i.diff>0?"200,40,60":i.diff<0?"20,150,100":"60,70,100";
      el.style.background=`rgba(${rgb},${a})`;
      el.querySelector(".pr").textContent=fmt(i.p);
      el.querySelector(".ch").innerHTML=`${arrow(i.diff)} ${sgn(i.diff)} (${sgn(i.pct,2)}%)`;
      drawLine(el.querySelector("canvas"),i.h,"#ffffff");
    }else if(layout==="focus"){
      el.querySelector(".fbig").className="fbig num "+c;el.querySelector(".fbig").textContent=fmt(i.p);
      const fc=el.querySelector(".fchg");fc.className="fchg num "+c;fc.textContent=`${arrow(i.diff)} ${sgn(i.diff)}（${sgn(i.pct,2)}%）`;
      el.querySelector(".fmeta").innerHTML=`<span>高値 <b>${fmt(Math.max(...i.h))}</b></span><span>安値 <b>${fmt(Math.min(...i.h))}</b></span><span>始値 <b>${fmt(i.open)}</b></span><span>前tick <b>${fmt(i.prev)}</b></span><span>${chosen.indexOf(focus)+1} / ${chosen.length}</span>`;
      drawLine(el.querySelector("canvas"),i.h,colOf(i.diff),{axis:true});
      if(old!=null&&old!==i.p){el.classList.remove("flash-up","flash-down");void el.offsetWidth;el.classList.add(i.p>old?"flash-up":"flash-down");}
    }else{
      el.className="it"+(i.d.id===focus?" sel":"");
      el.querySelector(".p").className="p num "+c;el.querySelector(".p").textContent=fmt(i.p);
      el.querySelector(".c").innerHTML=`<span class="${c}">${arrow(i.diff)} ${sgn(i.pct,2)}%</span>`;
      if(i.d.id===focus){
        const m=v.querySelector(".main");m.querySelector("h2").textContent=`${i.d.emoji} ${i.d.name}`;
        const b=m.querySelector(".big");b.className="big num "+c;b.innerHTML=`${fmt(i.p)} <small style="font-size:.28em">コイン</small> <span style="font-size:.3em">${arrow(i.diff)} ${sgn(i.diff)} (${sgn(i.pct,2)}%)</span>`;
        m.querySelector(".meta").innerHTML=`<span>高値 <b>${fmt(Math.max(...i.h))}</b></span><span>安値 <b>${fmt(Math.min(...i.h))}</b></span><span>始値 <b>${fmt(i.open)}</b></span><span>前tick <b>${fmt(i.prev)}</b></span><span>表示 <b>${i.h.length}</b>点</span>`;
        drawLine(m.querySelector("canvas"),i.h,colOf(i.diff),{axis:true});
      }
    }
    prevPrice[i.d.id]=i.p;
  });
}
$("view").onclick=e=>{if(layout!=="single")return;const it=e.target.closest(".it");if(it){focus=it.dataset.id;save();lastRenderKey="";render();}};
addEventListener("resize",()=>{lastRenderKey="";render();});

function stepFocus(d){const k=chosen.indexOf(focus);focus=chosen[(k+d+chosen.length)%chosen.length];save();lastRenderKey="";render();}
$("view").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(b)stepFocus(+b.dataset.d);});
document.addEventListener("keydown",e=>{if(layout==="focus"){if(e.key==="ArrowLeft")stepFocus(-1);if(e.key==="ArrowRight")stepFocus(1);}if(e.key==="b"||e.key==="B")$("blue").click();});
let blue=localStorage.getItem("sb_blue")==="1";
function applyBlue(){document.documentElement.classList.toggle("blue",blue);$("blue").classList.toggle("on",blue);}
$("blue").onclick=()=>{blue=!blue;localStorage.setItem("sb_blue",blue?"1":"0");applyBlue();lastRenderKey="";render();};
applyBlue();
buildBar();
onSnapshot(marketRef,snap=>{
  const data=snap.exists()?snap.data():null;if(!data||!data.stocks)return;
  const st=data.stocks;STOCKS.forEach(d=>{if(!st[d.id]||!st[d.id].h)st[d.id]=freshStock(d);});
  market=st;$("msg").style.display="none";render();
},()=>{$("msg").textContent="株価の取得に失敗しました";});
</script>
