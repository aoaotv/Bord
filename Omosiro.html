<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画面を爆破するページ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: pointer;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            pointer-events: none;
        }

        p {
            font-size: 1.2rem;
            color: #aaa;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
            transition: transform 1s ease-out, opacity 1s ease-out;
            opacity: 1;
        }
    </style>
</head>
<body>

    <h1>💥 画面のどこでもクリックしてみて！ 💥</h1>
    <p>クリックした場所から絵文字が飛び散ります</p>

    <script>
        // 飛び出す絵文字のリスト
        const emojis = ['ゲイ', '戸部くん', '野獣', '堀大輔', 'やば', 'ゲイゲイ', '漫', '自慢'];

        document.addEventListener('click', (e) => {
            // 1回のクリックで出す絵文字の数
            const particleCount = 20; 

            for (let i = 0; i < particleCount; i++) {
                createParticle(e.clientX, e.clientY);
            }
        });

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // ランダムに絵文字を選択
            particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // 初期位置をクリックされた場所に設定
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            document.body.appendChild(particle);

            // 飛び散る方向と距離をランダムに計算
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 200 + 50; // 50px〜250px
            const destinationX = Math.cos(angle) * velocity;
            const destinationY = Math.sin(angle) * velocity;
            const rotation = Math.random() * 360;

            // アニメーションの実行（微小な遅延を挟まないとCSS遷移が効かない場合があるため）
            setTimeout(() => {
                particle.style.transform = `translate(${destinationX}px, ${destinationY}px) rotate(${rotation}deg) scale(0.5)`;
                particle.style.opacity = '0';
            }, 10);

            // アニメーションが終わったら要素を削除
            setTimeout(() => {
                particle.remove();
            }, 1000);
        }
    </script>
</body>
</html>
