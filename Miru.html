<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bord - 管理者用ログ閲覧システム</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #1e293b;
      margin-bottom: 20px;
      font-size: 24px;
    }
    /* ログインカード */
    #loginCard {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 360px;
      margin: 60px auto;
      text-align: center;
    }
    #loginCard h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 20px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      outline: none;
    }
    input[type="password"]:focus {
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    /* ログ表示エリア */
    #logSection {
      display: none;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .status-badge {
      background: #10b981;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
    .log-table-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }
    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
      white-space: nowrap;
    }
    tr:hover {
      background-color: #f1f5f9;
    }
    .action-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
    }
    /* 操作別カラー */
    .act-create_thread { background-color: #10b981; } /* 緑 */
    .act-create_post { background-color: #3b82f6; }   /* 青 */
    .act-quick_send_post { background-color: #06b6d4; } /* シアン */
    .act-report_content { background-color: #ef4444; }  /* 赤 */
    .act-admin { background-color: #f59e0b; }         /* オレンジ */
    .act-default { background-color: #64748b; }       /* グレー */
    
    .detail-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .detail-item {
      margin-bottom: 4px;
    }
    .detail-item:last-child {
      margin-bottom: 0;
    }
    .detail-label {
      font-weight: bold;
      color: #475569;
      margin-right: 6px;
    }
    .detail-value {
      color: #0f172a;
      word-break: break-all;
    }
    .id-code {
      font-family: monospace;
      background: #e2e8f0;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      color: #334155;
    }
    /* もっと見るボタンエリア */
    .load-more-container {
      text-align: center;
      padding: 20px;
      background: white;
      border-radius: 0 0 12px 12px;
    }
    #loadMoreBtn {
      background-color: #e2e8f0;
      color: #334155;
      width: auto;
      padding: 10px 30px;
    }
    #loadMoreBtn:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. ログイン画面 -->
  <div id="loginCard">
    <h2>管理者用ログイン</h2>
    <p style="font-size:13px; color:#64748b;">ログを確認するには、管理者用パスワードを入力してください。</p>
    <input type="password" id="passInput" placeholder="パスワードを入力">
    <button id="loginBtn">ログイン</button>
  </div>

  <!-- 2. ログ閲覧画面 -->
  <div id="logSection">
    <h1>システム操作・投稿履歴 ログ一覧</h1>
    <div class="controls">
      <div>
        <strong>状態:</strong> <span class="status-badge">🟢 ログ閲覧モード</span>
      </div>
      <div>
        <span id="logCount" style="margin-right:15px; font-weight:bold; color:#64748b;">0 件表示中</span>
        <button id="logoutBtn" style="width:auto; padding:6px 16px; background:#ef4444;">ログアウト</button>
      </div>
    </div>

    <div class="log-table-container">
      <table>
        <thead>
          <tr>
            <th>日時</th>
            <th>操作の種類</th>
            <th>ユーザー名</th>
            <th>対象の部屋</th>
            <th>IPアドレス</th>
            <th>詳細情報</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr>
            <td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;">データを読み込んでいます...</td>
          </tr>
        </tbody>
      </table>
      <div class="load-more-container" id="loadMoreContainer" style="display: none;">
        <button id="loadMoreBtn">もっと読み込む (100件)</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getFirestore, collection, query, orderBy, limit, getDocs, startAfter
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC9ygh6HjX5mK1e5ZBnEWnLQCEjRMKIEWA",
  authDomain: "sinzo-3f972.firebaseapp.com",
  databaseURL: "https://sinzo-3f972-default-rtdb.firebaseio.com",
  projectId: "sinzo-3f972",
  storageBucket: "sinzo-3f972.firebasestorage.app",
  messagingSenderId: "1058985227031",
  appId: "1:1058985227031:web:6b152911e917903910bd52"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASS = "2059";
let lastVisibleDoc = null; // 最後に読み込んだドキュメント（ページング用）
let totalLoadedCount = 0;  // 読み込み済み件数

function formatDate(ts) {
  if (!ts) return "不明";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

function getActionInfo(action) {
  switch (action) {
    case "create_thread":
      return { text: "スレッド作成", class: "act-create_thread" };
    case "create_post":
      return { text: "投稿", class: "act-create_post" };
    case "quick_send_post":
      return { text: "クイック投稿", class: "act-quick_send_post" };
    case "report_content":
      return { text: "通報通知", class: "act-report_content" };
    case "admin_delete_thread":
      return { text: "スレッド削除(管理者)", class: "act-admin" };
    case "admin_delete_post":
      return { text: "投稿削除(管理者)", class: "act-admin" };
    case "admin_lock_thread":
      return { text: "スレッドロック(管理者)", class: "act-admin" };
    case "admin_unlock_thread":
      return { text: "ロック解除(管理者)", class: "act-admin" };
    case "admin_ban_user":
      return { text: "アクセス禁止(管理者)", class: "act-admin" };
    case "admin_unban_user":
      return { text: "禁止解除(管理者)", class: "act-admin" };
    case "admin_hide_post":
      return { text: "投稿非表示(管理者)", class: "act-admin" };
    default:
      if (action && action.startsWith("admin_")) {
        return { text: "管理者操作", class: "act-admin" };
      }
      return { text: action || "その他操作", class: "act-default" };
  }
}

function renderJapaneseDetail(detail) {
  if (!detail || typeof detail !== 'object' || Object.keys(detail).length === 0) {
    return '<span style="color:#94a3b8;">（詳細データなし）</span>';
  }

  const labelMap = {
    "index": "番号",
    "textSnippet": "投稿の本文",
    "text": "投稿本文",
    "title": "タイトル",
    "threadId": "スレッドID",
    "threadTitle": "スレッド名",
    "targetThreadId": "対象スレッドID",
    "targetThreadTitle": "スレッド名",
    "postId": "投稿ID",
    "targetPostId": "対象投稿ID",
    "userId": "ユーザーID",
    "targetUserId": "対象ユーザーID",
    "bannedIp": "制限したIP",
    "hasImage": "画像の有無",
    "reason": "理由",
    "target": "対象データ",
    "type": "種別"
  };

  let html = '<div class="detail-box">';
  for (const [key, value] of Object.entries(detail)) {
    const japaneseLabel = labelMap[key] || key;
    let displayValue = value;

    if (key === "threadId" || key === "postId") {
      displayValue = `<span class="id-code">${escapeHtml(String(value))}</span>`;
    } else if (key === "hasImage") {
      displayValue = value ? "あり 📷" : "なし";
    } else {
      displayValue = escapeHtml(String(value));
    }

    html += `
      <div class="detail-item">
        <span class="detail-label">・${japaneseLabel}:</span>
        <span class="detail-value">${displayValue}</span>
      </div>
    `;
  }
  html += '</div>';
  return html;
}

// ログデータを取得してテーブルに追加する関数
async function fetchLogs(isInitial = false) {
  const tbody = document.getElementById("logTableBody");
  const loadMoreContainer = document.getElementById("loadMoreContainer");

  if (isInitial) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;">データを読み込んでいます...</td></tr>';
    totalLoadedCount = 0;
    lastVisibleDoc = null;
  }

  try {
    let q = query(
      collection(db, "logs"),
      orderBy("created_at", "desc"),
      limit(100)
    );

    if (!isInitial && lastVisibleDoc) {
      q = query(
        collection(db, "logs"),
        orderBy("created_at", "desc"),
        startAfter(lastVisibleDoc),
        limit(100)
      );
    }

    const snapshot = await getDocs(q);

    if (isInitial) {
      tbody.innerHTML = "";
    }

    if (snapshot.empty && isInitial) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;">記録されているログがありません</td></tr>';
      loadMoreContainer.style.display = "none";
      return;
    }

    if (!snapshot.empty) {
      snapshot.docs.forEach((doc) => {
        const log = doc.data();
        const tr = document.createElement("tr");

        const actionInfo = getActionInfo(log.action);
        const japaneseDetailHtml = renderJapaneseDetail(log.detail);

        tr.innerHTML = `
          <td style="white-space:nowrap; color:#64748b; font-size:13px;">${formatDate(log.created_at)}</td>
          <td><span class="action-badge ${actionInfo.class}">${actionInfo.text}</span></td>
          <td><strong>${escapeHtml(log.user || '名前なし')}</strong></td>
          <td>${escapeHtml(log.room || '全般・指定なし')}</td>
          <td style="font-family:monospace; font-size:12px; color:#475569;">${escapeHtml(log.ip || '-')}</td>
          <td>${japaneseDetailHtml}</td>
        `;

        tbody.appendChild(tr);
      });

      // 次回取得のためのカーソルを更新
      lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
      totalLoadedCount += snapshot.docs.length;
      document.getElementById("logCount").textContent = `${totalLoadedCount} 件表示中`;

      // 100件未満しかなければ「もっと読み込む」を非表示、あれば表示
      if (snapshot.docs.length < 100) {
        loadMoreContainer.style.display = "none";
      } else {
        loadMoreContainer.style.display = "block";
      }
    } else {
      loadMoreContainer.style.display = "none";
    }

  } catch (error) {
    console.error("ログ取得エラー:", error);
    alert("ログ情報の読み込みに失敗しました。アクセス権限等を確認してください。");
  }
}

// ログイン処理
function login() {
  const pass = document.getElementById("passInput").value;
  if (pass !== ADMIN_PASS) {
    alert("パスワードが正しくありません。");
    return;
  }

  document.getElementById("loginCard").style.display = "none";
  document.getElementById("logSection").style.display = "block";

  // 初回100件取得
  fetchLogs(true);
}

function escapeHtml(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
  });
}

// イベント設定
document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("passInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") login();
});

document.getElementById("loadMoreBtn").addEventListener("click", () => {
  fetchLogs(false);
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  document.getElementById("passInput").value = "";
  document.getElementById("logSection").style.display = "none";
  document.getElementById("loginCard").style.display = "block";
});
</script>
</body>
</html>
