<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bord - 管理者用ログ閲覧システム</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #1e293b;
      margin-bottom: 20px;
      font-size: 24px;
    }
    /* ログインカード */
    #loginCard {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 360px;
      margin: 60px auto;
      text-align: center;
    }
    #loginCard h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 20px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      outline: none;
    }
    input[type="password"]:focus {
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    /* ログ表示エリア */
    #logSection {
      display: none;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .status-badge {
      background: #10b981;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
    .log-table-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }
    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
      white-space: nowrap;
    }
    tr:hover {
      background-color: #f1f5f9;
    }
    .action-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
    }
    /* 操作別カラー */
    .act-create_thread { background-color: #10b981; } /* 緑 */
    .act-create_post { background-color: #3b82f6; }   /* 青 */
    .act-quick_send_post { background-color: #06b6d4; } /* シアン */
    .act-report_content { background-color: #ef4444; }  /* 赤 */
    .act-admin { background-color: #f59e0b; }         /* オレンジ */
    .act-rate { background-color: #8b5cf6; }          /* 紫 (評価用に追加) */
    .act-default { background-color: #64748b; }       /* グレー */
    .act-dm { background-color: #0891b2; }            /* DM */
    .act-money { background-color: #0ea5e9; }         /* コイン・送金 */
    .act-deposit { background-color: #14b8a6; }       /* 預金 */
    .act-stock { background-color: #7c3aed; }         /* 株 */
    .act-game { background-color: #f97316; }          /* ゲーム */
    
    .detail-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .detail-item {
      margin-bottom: 4px;
    }
    .detail-item:last-child {
      margin-bottom: 0;
    }
    .detail-label {
      font-weight: bold;
      color: #475569;
      margin-right: 6px;
    }
    .detail-value {
      color: #0f172a;
      word-break: break-all;
    }
    .id-code {
      font-family: monospace;
      background: #e2e8f0;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      color: #334155;
    }
    /* もっと見るボタンエリア */
    .load-more-container {
      text-align: center;
      padding: 20px;
      background: white;
      border-radius: 0 0 12px 12px;
    }
    #loadMoreBtn {
      background-color: #e2e8f0;
      color: #334155;
      width: auto;
      padding: 10px 30px;
    }
    #loadMoreBtn:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. ログイン画面 -->
  <div id="loginCard">
    <h2>管理者用ログイン</h2>
    <p style="font-size:13px; color:#64748b;">ログを確認するには、管理者用パスワードを入力してください。</p>
    <input type="password" id="passInput" placeholder="パスワードを入力">
    <button id="loginBtn">ログイン</button>
  </div>

  <!-- 2. ログ閲覧画面 -->
  <div id="logSection">
    <h1>システム操作・投稿履歴 ログ一覧</h1>
    <div class="controls">
      <div>
        <strong>状態:</strong> <span class="status-badge">🟢 ログ閲覧モード</span>
      </div>
      <div>
        <span id="logCount" style="margin-right:15px; font-weight:bold; color:#64748b;">0 件表示中</span>
        <button id="logoutBtn" style="width:auto; padding:6px 16px; background:#ef4444;">ログアウト</button>
      </div>
    </div>

    <div class="log-table-container">
      <table>
        <thead>
          <tr>
            <th>日時</th>
            <th>操作の種類</th>
            <th>ユーザー名</th>
            <th>対象の部屋</th>
            <th>IPアドレス</th>
            <th>詳細情報</th>
          </tr>
        </thead>
        <tbody id="logTableBody">
          <tr>
            <td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;">データを読み込んでいます...</td>
          </tr>
        </tbody>
      </table>
      <div class="load-more-container" id="loadMoreContainer" style="display: none;">
        <button id="loadMoreBtn">もっと読み込む (100件)</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getFirestore, collection, query, orderBy, limit, getDocs, startAfter
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBX1ytdufTmbCtNiyLxrpzrreYwsgNNhRA",
  authDomain: "sinzobord.firebaseapp.com",
  projectId: "sinzobord",
  storageBucket: "sinzobord.firebasestorage.app",
  messagingSenderId: "326229251487",
  appId: "1:326229251487:web:d5a32cb2a9023d862819aa"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASS = "2026";   // index.html の ADMIN_PASSWORD と同じ値
let lastVisibleDoc = null; // 最後に読み込んだドキュメント（ページング用）
let totalLoadedCount = 0;  // 読み込み済み件数

function formatDate(ts) {
  if (!ts) return "不明";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

// ---- index.html が実際に記録している操作名 ----
const ACTION_MAP = {
  // 掲示板
  create_thread: ["スレッド作成", "act-create_thread"],
  create_post: ["投稿", "act-create_post"],
  quick_send_post: ["クイック投稿", "act-quick_send_post"],
  report_content: ["通報通知", "act-report_content"],
  rate_thread: ["評価", "act-rate"],
  send_dm: ["DM送信", "act-dm"],
  create_room: ["部屋作成", "act-create_thread"],
  delete_own_thread: ["自分のスレッド削除", "act-default"],
  delete_own_post: ["自分の投稿削除", "act-default"],
  boost_thread: ["スレッド注目固定", "act-money"],
  // コイン・預金・株・ゲーム
  send_coin: ["コイン送金", "act-money"],
  coin_rain: ["コインの雨", "act-money"],
  coin_redeem: ["コインコード使用", "act-money"],
  premium_buy: ["プレミアム購入", "act-money"],
  shop_buy: ["ショップ購入", "act-money"],
  deposit_in: ["預金に預入", "act-deposit"],
  deposit_out: ["預金から引出", "act-deposit"],
  stock_buy: ["株を購入", "act-stock"],
  stock_sell: ["株を売却", "act-stock"],
  gacha: ["ガチャ", "act-game"],
  dice_win: ["サイコロ（勝ち）", "act-game"],
  dice_lose: ["サイコロ（負け）", "act-game"],
  roulette: ["ルーレット", "act-game"],
  // 管理者操作
  admin_login_success: ["管理者ログイン", "act-admin"],
  admin_delete_thread: ["スレッド削除(管理者)", "act-admin"],
  admin_delete_post: ["投稿削除(管理者)", "act-admin"],
  admin_delete_room: ["部屋削除(管理者)", "act-admin"],
  admin_update_thread_flags: ["スレッド設定変更(管理者)", "act-admin"],
  admin_ip_ban: ["IP制限(管理者)", "act-admin"],
  admin_ip_unban: ["IP制限解除(管理者)", "act-admin"],
  admin_account_ban: ["アカウント凍結(管理者)", "act-admin"],
  admin_account_unban: ["凍結解除(管理者)", "act-admin"],
  admin_account_delete: ["アカウント削除(管理者)", "act-admin"],
  admin_edit_account_coins: ["コイン数の変更(管理者)", "act-admin"],
  admin_edit_account_shares: ["保有株数の変更(管理者)", "act-admin"],
  admin_edit_account_store_items: ["所持アイテムの変更(管理者)", "act-admin"],
  admin_edit_stock_price: ["株価の強制変更(管理者)", "act-admin"],
  admin_create_coin_code: ["コインコード作成(管理者)", "act-admin"],
  admin_toggle_badge: ["公式バッジ切替(管理者)", "act-admin"],
  admin_change_badge_text: ["バッジ文字変更(管理者)", "act-admin"],
  admin_send_notice: ["お知らせ送信(管理者)", "act-admin"],
  admin_delete_stock_history: ["株価履歴の削除(管理者)", "act-admin"],
  admin_delete_stock_points: ["株価データの削除(管理者)", "act-admin"],
  // 旧ログ（互換のため残す）
  admin_lock_thread: ["スレッドロック(管理者)", "act-admin"],
  admin_unlock_thread: ["ロック解除(管理者)", "act-admin"],
  admin_ban_user: ["アクセス禁止(管理者)", "act-admin"],
  admin_unban_user: ["禁止解除(管理者)", "act-admin"],
  admin_hide_post: ["投稿非表示(管理者)", "act-admin"]
};

function getActionInfo(action) {
  const hit = ACTION_MAP[action];
  if (hit) return { text: hit[0], class: hit[1] };
  if (action && action.startsWith("admin_")) return { text: "管理者操作", class: "act-admin" };
  return { text: action || "その他操作", class: "act-default" };
}

// 株の銘柄ID → 名前（index.html の STOCKS と同じ）
const STOCK_NAMES = { snz: "sinzo株式会社", snzb: "sinzobord", frbs: "firebase株式会社", mrbs: "丸菱商事", bepn: "別班", szmt: "sinzomart", szdk: "sinzo電力", szsh: "sinzo高校", szwt: "sinzowater", szgs: "sinzoガス" };

const LABEL_MAP = {
  index: "番号", textSnippet: "投稿の本文", text: "本文", title: "タイトル",
  threadId: "スレッドID", threadTitle: "スレッド名", targetThreadId: "対象スレッドID", targetThreadTitle: "スレッド名",
  postId: "投稿ID", targetPostId: "対象投稿ID", userId: "ユーザーID", targetUserId: "対象ユーザーID",
  bannedIp: "制限したIP", targetIp: "対象IP", hasImage: "画像の有無", hasPassword: "パスワード設定",
  highlighted: "強調表示", reason: "理由", target: "対象データ", type: "種別",
  roomName: "部屋名", targetRoomId: "対象の部屋ID", locked: "ロック", pinned: "固定",
  to: "宛先", from: "送信者", amount: "金額（コイン）", recipientsCount: "分配した人数",
  coinsAfter: "操作後の所持コイン", fromAfter: "送信者の操作後コイン", toAfter: "受取人の操作後コイン", depAfter: "操作後の預金",
  stock: "銘柄", stocks: "銘柄", qty: "数量（株）", price: "価格（コイン）", total: "合計（コイン）",
  bet: "賭け金", reward: "払い戻し", diceVal: "出目", prize: "獲得コイン", days: "日数", cost: "費用（コイン）",
  code: "コード", kind: "種類", name: "名前",
  targetAccount: "対象アカウント", newCoins: "設定したコイン", newShares: "設定した株数", newPrice: "設定した株価",
  tagsCount: "タグ数", emojisCount: "スタンプ数", badgeText: "バッジ文字", enabled: "公式バッジ",
  archiveDocsUpdated: "更新した履歴ファイル数", resetLoHi: "最安・最高値をリセット", recalcLoHi: "最安・最高値を再計算", count: "削除した点数"
};
const ID_KEYS = new Set(["threadId", "postId", "targetThreadId", "targetPostId", "targetRoomId"]);
const NUM_KEYS = new Set(["amount", "coinsAfter", "fromAfter", "toAfter", "depAfter", "price", "total", "bet", "reward", "prize", "cost", "newCoins", "newShares", "newPrice", "qty"]);

function formatValue(key, value) {
  if (value === null || value === undefined) return "-";
  if (key === "hasImage") return value ? "あり 📷" : "なし";
  if (key === "enabled") return value ? "ON" : "OFF";
  if (key === "type") return value === "like" ? "高評価" : value === "dislike" ? "低評価" : escapeHtml(String(value));
  if (key === "stock") return escapeHtml(STOCK_NAMES[value] || String(value));
  if (key === "stocks" && Array.isArray(value)) return escapeHtml(value.map(v => STOCK_NAMES[v] || v).join("、"));
  if (ID_KEYS.has(key)) return `<span class="id-code">${escapeHtml(String(value))}</span>`;
  if (typeof value === "boolean") return value ? "はい" : "いいえ";
  if (typeof value === "number" && NUM_KEYS.has(key)) return value.toLocaleString("ja-JP");
  if (Array.isArray(value)) return escapeHtml(value.join("、"));
  if (typeof value === "object") return escapeHtml(JSON.stringify(value));
  return escapeHtml(String(value));
}

function renderJapaneseDetail(detail) {
  if (!detail || typeof detail !== 'object' || Object.keys(detail).length === 0) {
    return '<span style="color:#94a3b8;">（詳細データなし）</span>';
  }
  let html = '<div class="detail-box">';
  for (const [key, value] of Object.entries(detail)) {
    html += `
      <div class="detail-item">
        <span class="detail-label">・${escapeHtml(LABEL_MAP[key] || key)}:</span>
        <span class="detail-value">${formatValue(key, value)}</span>
      </div>
    `;
  }
  html += '</div>';
  return html;
}

// ログデータを取得してテーブルに追加する関数
async function fetchLogs(isInitial = false) {
  const tbody = document.getElementById("logTableBody");
  const loadMoreContainer = document.getElementById("loadMoreContainer");

  if (isInitial) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;">データを読み込んでいます...</td></tr>';
    totalLoadedCount = 0;
    lastVisibleDoc = null;
  }

  try {
    let q = query(
      collection(db, "logs"),
      orderBy("created_at", "desc"),
      limit(100)
    );

    if (!isInitial && lastVisibleDoc) {
      q = query(
        collection(db, "logs"),
        orderBy("created_at", "desc"),
        startAfter(lastVisibleDoc),
        limit(100)
      );
    }

    const snapshot = await getDocs(q);

    if (isInitial) {
      tbody.innerHTML = "";
    }

    if (snapshot.empty && isInitial) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#94a3b8;">記録されているログがありません</td></tr>';
      loadMoreContainer.style.display = "none";
      return;
    }

    if (!snapshot.empty) {
      snapshot.docs.forEach((doc) => {
        const log = doc.data();
        const tr = document.createElement("tr");

        const actionInfo = getActionInfo(log.action);
        const japaneseDetailHtml = renderJapaneseDetail(log.detail);

        tr.innerHTML = `
          <td style="white-space:nowrap; color:#64748b; font-size:13px;">${formatDate(log.created_at)}</td>
          <td><span class="action-badge ${actionInfo.class}">${actionInfo.text}</span></td>
          <td><strong>${escapeHtml(log.user || '名前なし')}</strong></td>
          <td>${escapeHtml(log.room || '全般・指定なし')}</td>
          <td style="font-family:monospace; font-size:12px; color:#475569;">${escapeHtml(log.ip || '-')}</td>
          <td>${japaneseDetailHtml}</td>
        `;

        tbody.appendChild(tr);
      });

      // 次回取得のためのカーソルを更新
      lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
      totalLoadedCount += snapshot.docs.length;
      document.getElementById("logCount").textContent = `${totalLoadedCount} 件表示中`;

      // 100件未満しかなければ「もっと読み込む」を非表示、あれば表示
      if (snapshot.docs.length < 100) {
        loadMoreContainer.style.display = "none";
      } else {
        loadMoreContainer.style.display = "block";
      }
    } else {
      loadMoreContainer.style.display = "none";
    }

  } catch (error) {
    console.error("ログ取得エラー:", error);
    alert("ログ情報の読み込みに失敗しました。アクセス権限等を確認してください。");
  }
}

// ログイン処理
function login() {
  const pass = document.getElementById("passInput").value;
  if (pass !== ADMIN_PASS) {
    alert("パスワードが正しくありません。");
    return;
  }

  document.getElementById("loginCard").style.display = "none";
  document.getElementById("logSection").style.display = "block";

  // 初回100件取得
  fetchLogs(true);
}

function escapeHtml(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
  });
}

// イベント設定
document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("passInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") login();
});

document.getElementById("loadMoreBtn").addEventListener("click", () => {
  fetchLogs(false);
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  document.getElementById("passInput").value = "";
  document.getElementById("logSection").style.display = "none";
  document.getElementById("loginCard").style.display = "block";
});
</script>
</body>
</html>
