<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>株価リセットツール</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; background-color: #e6f0ff; margin: 0; padding: 20px; color: #333; }
  .container { max-width: 400px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: left; }
  h2 { margin-top: 0; color: #2c3e50; text-align: center; font-size: 22px; }
  label { display: block; margin-top: 12px; font-size: 14px; font-weight: bold; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; height: 40px; }
  button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 6px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
  button:active { transform: scale(0.98); }
  .success { color: #27ae60; font-weight: bold; text-align: center; margin-top: 12px; }
  .info { background: #f7f9fc; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; border: 1px solid #dfe6e9; }
</style>
</head>
<body>

<div class="container">
  <h2>📈 株価リセットツール</h2>
  
  <!-- ログイン画面 -->
  <div id="loginSection">
    <label>管理者パスワード</label>
    <input type="password" id="adminPassword" placeholder="パスワードを入力">
    <button id="loginBtn" style="background-color: #3498db;">ログイン</button>
  </div>

  <!-- リセット操作画面 -->
  <div id="toolSection" style="display:none;">
    <div class="info">
      現在の株価: <strong id="currentPriceView" style="color:#e67e22;">---</strong> コイン
    </div>

    <label>リセット後の初期株価（空欄の場合は現在の株価を維持）</label>
    <input type="number" id="newPriceInput" placeholder="例: 100">

    <button id="resetBtn" style="background-color: #e74c3c;">最高値・最低値をリセットする</button>
    <div id="resultMsg"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, Timestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC9ygh6HjX5mK1e5ZBnEWnLQCEjRMKIEWA",
    authDomain: "sinzo-3f972.firebaseapp.com",
    databaseURL: "https://sinzo-3f972-default-rtdb.firebaseio.com",
    projectId: "sinzo-3f972",
    storageBucket: "sinzo-3f972.firebasestorage.app",
    messagingSenderId: "1058985227031",
    appId: "1:1058985227031:web:6b152911e917903910bd52"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let fetchedCurrentPrice = 100;

  document.getElementById("loginBtn").onclick = async () => {
    const pass = document.getElementById("adminPassword").value.trim();
    if (pass !== "2026") {
      alert("パスワードが違います");
      return;
    }

    document.getElementById("loginSection").style.display = "none";
    document.getElementById("toolSection").style.display = "block";

    try {
      const marketRef = doc(db, "market", "global");
      const snap = await getDoc(marketRef);
      if (snap.exists()) {
        const data = snap.data();
        fetchedCurrentPrice = data.currentPrice || 100;
        document.getElementById("currentPriceView").textContent = fetchedCurrentPrice;
        document.getElementById("newPriceInput").value = fetchedCurrentPrice;
      }
    } catch (e) {
      alert("市場データの取得に失敗しました。");
    }
  };

  document.getElementById("resetBtn").onclick = async () => {
    const inputVal = document.getElementById("newPriceInput").value.trim();
    const targetPrice = inputVal !== "" ? parseInt(inputVal, 10) : fetchedCurrentPrice;

    if (isNaN(targetPrice) || targetPrice < 0) {
      alert("有効な株価を入力してください。");
      return;
    }

    if (!confirm(`株価を ${targetPrice} コインにし、最高値・最低値および価格履歴をリセットしますか？`)) return;

    try {
      const marketRef = doc(db, "market", "global");
      await setDoc(marketRef, {
        currentPrice: targetPrice,
        priceHistory: [targetPrice],
        minPrice: targetPrice,
        maxPrice: targetPrice,
        updated_at: Timestamp.now()
      });

      document.getElementById("resultMsg").className = "success";
      document.getElementById("resultMsg").textContent = "✨ 最高値と最低値をリセットしました！";
      document.getElementById("currentPriceView").textContent = targetPrice;
    } catch (e) {
      alert("リセットに失敗しました。");
    }
  };
</script>

</body>
</html>
