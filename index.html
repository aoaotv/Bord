function enableLongPressInfo(element, infoText, reportData) {
  let pressTimer;

  const start = () => {
    pressTimer = setTimeout(() => {
      const dialog = document.createElement("div");
      dialog.style.position = "fixed";
      dialog.style.top = "50%";
      dialog.style.left = "50%";
      dialog.style.transform = "translate(-50%, -50%)";
      dialog.style.background = "#fff";
      dialog.style.padding = "18px";
      dialog.style.borderRadius = "12px";
      dialog.style.boxShadow = "0 0 10px rgba(0,0,0,0.4)";
      dialog.style.zIndex = "9999";
      dialog.style.whiteSpace = "pre-line";

      dialog.innerHTML = `
${infoText}

<button id="reportBtn" style="background:#e74c3c;color:white;padding:6px 12px;border-radius:8px;margin-right:12px;">報告する</button>
<button id="closeBtn" style="background:#3498db;color:white;padding:6px 12px;border-radius:8px;">閉じる</button>
`;

      document.body.appendChild(dialog);

      dialog.querySelector("#closeBtn").onclick = () => dialog.remove();

      dialog.querySelector("#reportBtn").onclick = async () => {
        await addDoc(collection(db, "reports"), {
          ...reportData,
          reported_at: Timestamp.now()
        });
        await saveLog("report_content", reportData);
        alert("通報を受け付けました");
        dialog.remove();
      };

    }, 3000);
  };

  const cancel = () => clearTimeout(pressTimer);

  element.addEventListener("mousedown", start);
  element.addEventListener("touchstart", start);
  element.addEventListener("mouseup", cancel);
  element.addEventListener("mouseleave", cancel);
  element.addEventListener("touchend", cancel);
}

function convertText(text) {
  if (!text) return "";
  const urlPattern = /(https?:\/\/[^\s]+)/g;
  text = text.replace(urlPattern, `<a href="$1" target="_blank" style="color:#ff0000;text-decoration:underline;">$1</a>`);

  const anchorPattern = /[>＞]\s*(\d+)/g;
  text = text.replace(anchorPattern, `<span class="anchorLink" data-num="$1" style="color:#ff0000; cursor:pointer;">&gt;$1</span>`);

  return text;
}

let cachedIP = null;
async function getClientIP(){
  if (cachedIP) return cachedIP;
  try{
    const res = await fetch("https://api.ipify.org?format=json");
    const data = await res.json();
    cachedIP = data.ip || "unknown";
    return cachedIP;
  }catch(e){
    console.warn("IP取得失敗:", e);
    return "unknown";
  }
}

async function isIPBanned(ip){
  if(!ip || ip === "unknown") return false;
  try{
    const banDoc = await getDoc(doc(db, "ipBans", ip));
    return banDoc.exists();
  }catch(e){
    console.error("IP BAN確認エラー:", e);
    return false;
  }
}

async function stopIfBanned(){
  const ip = await getClientIP();
  if(await isIPBanned(ip)){
    showAlert("このIPは利用規約違反のため制限されています");
    return true;
  }
  return false;
}

function getCookie(name) {
  const value = `; ${document.cookie}`;
  const parts = value.split(`; ${name}=`);
  if (parts.length === 2) {
    try { return decodeURIComponent(parts.pop().split(';').shift()); } catch(e){ return parts.pop().split(';').shift(); }
  }
  return null;
}

function setCookie(name, value, days=365) {
  const d = new Date();
  d.setTime(d.getTime() + (days*24*60*60*1000));
  document.cookie = `${name}=${encodeURIComponent(value)}; expires=${d.toUTCString()}; path=/`;
}

function setRateCookie(threadId, type) {
  const d = new Date();
  d.setTime(d.getTime() + (365*24*60*60*1000));
  document.cookie = `rate_${threadId}=${type}; expires=${d.toUTCString()}; path=/`;
}
function getRateCookie(threadId) {
  const value = `; ${document.cookie}`;
  const parts = value.split(`; rate_${threadId}=`);
  if (parts.length === 2) return parts.pop().split(";").shift();
  return null;
}

function formatDate(ts){ 
  if(!ts) return '';
  const d = ts.toDate? ts.toDate() : new Date(ts);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatRelativeTime(ts){
  if(!ts) return '';
  const now = new Date();
  const d = ts.toDate ? ts.toDate() : new Date(ts);

  const diffMs = now - d;
  const diffSec = Math.floor(diffMs / 1000);
  const diffMin = Math.floor(diffSec / 60);
  const diffHour = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHour / 24);

  const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;

  if(diffDay > 0) return `${dateStr} (${diffDay}日前)`;
  if(diffHour > 0) return `${dateStr} (${diffHour}時間前)`;
  if(diffMin > 0) return `${dateStr} (${diffMin}分前)`;
  return `${dateStr} (たった今)`;
}

async function fileToBase64(file,maxWidth=800,maxHeight=800,quality=0.7){
  if(!file) return null;
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = err => reject(err);
    img.onload = ()=>{
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxWidth){ h=h*(maxWidth/w); w=maxWidth; }
      if(h>maxHeight){ w=w*(maxHeight/h); h=maxHeight; }
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    reader.readAsDataURL(file);
  });
}

const iconCache = {};
async function getIconSrc(iconId){
  if(!iconId) return null;
  if(iconCache[iconId]) return iconCache[iconId];
  try{
    const d = await getDoc(doc(db, 'icons', iconId));
    if(d.exists()){
      const b = d.data().base64;
      iconCache[iconId] = b;
      return b;
    }
  }catch(e){ console.error(e); }
  return null;
}

function isTrendingThread(data) {
  if (!data.latestPostTime || !data.postCount) return false;

  const now = Date.now();
  const latest =
    typeof data.latestPostTime.toMillis === "function"
      ? data.latestPostTime.toMillis()
      : new Date(data.latestPostTime).getTime();

  const diffMinutes = (now - latest) / 1000 / 60;

  return diffMinutes <= 5 && data.postCount >= 10;
}

function renderThreadsPage(){
  const threadListSection = document.getElementById('threadListSection');
  const scrollTop = threadListSection.scrollTop;

  const threadList=document.getElementById('threadList');
  threadList.innerHTML="";
  const start = (getCurrentPage() - 1) * pageSize;
  const pageThreads=threadsData.slice(start,start+pageSize);
  if(pageThreads.length===0){ threadList.innerHTML="<li>まだありません</li>"; return; }
  
  const now = Date.now();

  pageThreads.forEach(docItem=>{
    const data=docItem.data();
    const postCount = data.postCount || 0;
    const li=document.createElement("li");
    li.style.backgroundColor = data.color || "#3498db";

    const createdAt = data.created_at?.toMillis ? data.created_at.toMillis() : new Date(data.created_at || 0).getTime();
    if (now - createdAt < 10000) { 
      li.classList.add("new-thread-animation");
    }

    let titleText = data.locked ? `🔒${data.title}` : data.title;

    if (data.password) {
      titleText += " 🔑";
    }

    if (data.pinned) {
      titleText = "📌 " + titleText;
    }

    if (isTrendingThread(data)) {
      titleText = "🔥 " + titleText;
    }

    const titleEl = document.createElement('div');
    titleEl.innerHTML = `<strong>${titleText}</strong>`;

    const countEl = document.createElement('small');
    countEl.textContent = `投稿数: ${postCount}`;
    const detailEl = document.createElement('small');
    detailEl.textContent = data.detail || '';

    const rateBox = document.createElement('div');
    rateBox.className = "threadRateBox";

    const likeBtn = document.createElement('button');
    likeBtn.className = "threadRateBtn";
    likeBtn.innerHTML = `👍 <span class="threadRateCount">${data.likes || 0}</span>`;

    const dislikeBtn = document.createElement('button');
    dislikeBtn.className = "threadRateBtn";
    dislikeBtn.innerHTML = `👎 <span class="threadRateCount">${data.dislikes || 0}</span>`;

    rateBox.appendChild(likeBtn);
    rateBox.appendChild(dislikeBtn);

    li.appendChild(titleEl);
    li.appendChild(countEl);
    li.appendChild(detailEl);
    li.appendChild(rateBox);

    if(data.image){
      const btn=document.createElement('button');
      btn.textContent="画像を表示";
      btn.className="greenBtn";
      btn.style.display="block";
      btn.style.marginTop="5px";
      btn.addEventListener('click', (e) => { e.stopPropagation(); showImagePopup(data.image); });
      li.appendChild(btn);
    }

    li.addEventListener('click',()=>{ tryOpenThread(docItem.id,data); });

    enableLongPressInfo(
      li,
      `【スレッド情報】\nID: ${docItem.id}\n作成日時: ${formatDate(data.created_at)}\n投稿数: ${postCount}\n色: ${data.color}\nIP: ${data.ip || data.created_ip || "未取得"}`,
      {
        type: "thread",
        threadId: docItem.id,
        created_at: data.created_at,
        postCount,
        color: data.color,
        ip: data.ip || data.created_ip || null
      }
    );

    likeBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const rated = getRateCookie(docItem.id);
      if (rated) { showAlert("すでに押されています"); return; }
      try {
        const nextLikes = (data.likes || 0) + 1;
        await updateDoc(doc(db, currentRoom, docItem.id), { likes: nextLikes });

        data.likes = nextLikes;
        const countEl = likeBtn.querySelector(".threadRateCount");
        if (countEl) countEl.textContent = nextLikes;

        setRateCookie(docItem.id, "like");
        await saveLog("rate_thread", { threadId: docItem.id, type: "like" });
      } catch (err) { console.error(err); showAlert("エラーが発生しました"); }
    });

    dislikeBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const rated = getRateCookie(docItem.id);
      if (rated) { showAlert("すでに押されています"); return; }
      try {
        const nextDislikes = (data.dislikes || 0) + 1;
        await updateDoc(doc(db, currentRoom, docItem.id), { dislikes: nextDislikes });

        data.dislikes = nextDislikes;
        const countEl = dislikeBtn.querySelector(".threadRateCount");
        if (countEl) countEl.textContent = nextDislikes;

        setRateCookie(docItem.id, "dislike");
        await saveLog("rate_thread", { threadId: docItem.id, type: "dislike" });
      } catch (err) { console.error(err); showAlert("エラーが発生しました"); }
    });

    threadList.appendChild(li);
  });

  const pagination=document.getElementById('pagination');
  pagination.innerHTML="";

  if (!isAllLoaded) {
    const btn = document.createElement("button");
    btn.textContent = "さらに読み込む";
    btn.className = "pageBtn";
    btn.onclick = loadAllThreads;
    pagination.appendChild(btn);
    threadListSection.scrollTop = scrollTop;
    return;
  }

  const totalPages=Math.max(1,Math.ceil(threadsData.length/pageSize));
  for(let i=1;i<=totalPages;i++){
    const btn=document.createElement("button");
    btn.textContent=i;
    btn.className="pageBtn";
    if(i === getCurrentPage()) btn.disabled = true;
    btn.addEventListener('click', () => {
      pageByRoom[currentRoom] = i;
      renderThreadsPage();
    });
    pagination.appendChild(btn);
  }

  threadListSection.scrollTop = scrollTop; 
}

async function listenThreads(){
  if (threadsUnsub) threadsUnsub();
  if (pinnedUnsub) { pinnedUnsub(); pinnedUnsub = null; }
  showLoading("スレッドを読み込み中...");

  const searchInput = document.getElementById("threadSearchInput");

  const listenNormal = () => {
    if (threadsUnsub) threadsUnsub();
    if (pinnedUnsub) { pinnedUnsub(); pinnedUnsub = null; }

    let isInitialLoad = true;
    let normalThreads = [];
    let pinnedThreads = [];

    const mergeAndRender = () => {
      const map = new Map();
      normalThreads.forEach(t => map.set(t.id, t));
      pinnedThreads.forEach(t => map.set(t.id, t));
      
      threadsData = Array.from(map.values());
      isAllLoaded = false;
      applySort();
      renderThreadsPage();
      hideLoading();
    };

    const qNormal = query(
      collection(db, currentRoom),
      orderBy("created_at", "desc"),
      limit(pageSize)
    );

    threadsUnsub = onSnapshot(qNormal, snap => {
      if (!isInitialLoad) {
        snap.docChanges().forEach(change => {
          if (change.type === "added") {
            const newThread = change.doc.data();
            showTopNotification(`新しいスレッド「${newThread.title}」が作成されました`);
          }
        });
      }
      isInitialLoad = false;

      normalThreads = snap.docs.map(d => ({
        id: d.id,
        data: () => d.data()
      }));
      mergeAndRender();
    });

    const qPinned = query(
      collection(db, currentRoom),
      where("pinned", "==", true)
    );

    pinnedUnsub = onSnapshot(qPinned, snap => {
      pinnedThreads = snap.docs.map(d => ({
        id: d.id,
        data: () => d.data()
      }));
      mergeAndRender();
    });
  };

  const listenSearch = (word) => {
    if (threadsUnsub) threadsUnsub();
    if (pinnedUnsub) { pinnedUnsub(); pinnedUnsub = null; }

    const q = query(
      collection(db, currentRoom),
      orderBy("created_at", "desc")
    );

    threadsUnsub = onSnapshot(q, snap => {
      const allDocs = snap.docs.map(d => ({
        id: d.id,
        data: () => d.data()
      }));

      threadsData = allDocs.filter(item => {
        const title = item.data().title || "";
        return title.includes(word);
      });

      isAllLoaded = true;
      pageByRoom[currentRoom] = 1;
      applySort();
      renderThreadsPage();
      hideLoading();
    });
  };

  listenNormal();

  if (!searchInput.dataset.bound) {
    searchInput.addEventListener("input", () => {
      const word = searchInput.value.trim();
      if (word === "") {
        listenNormal();
      } else {
        listenSearch(word);
      }
    });
    searchInput.dataset.bound = "1";
  }
}

function applySort(){
  if(!threadsData || threadsData.length===0) return;
  threadsData.sort((a,b)=>{
    const A = a.data();
    const B = b.data();

    const pinA = A.pinned === true;
    const pinB = B.pinned === true;
    if (pinA && !pinB) return -1;
    if (!pinA && pinB) return 1;

    const trendA = isTrendingThread(A);
    const trendB = isTrendingThread(B);
    if (trendA && !trendB) return -1;
    if (!trendA && trendB) return 1;

    const tAobj = A.created_at;
    const tBobj = B.created_at;
    let tA = 0, tB = 0;

    if(tAobj){
      tA = typeof tAobj.toMillis === 'function' ? tAobj.toMillis() : new Date(tAobj).getTime();
    }
    if(tBobj){
      tB = typeof tBobj.toMillis === 'function' ? tBobj.toMillis() : new Date(tBobj).getTime();
    }

    const lpA = A.latestPostTime || 0;
    const lpB = B.latestPostTime || 0;

    if(sortMode === "new") return tB - tA;
    if(sortMode === "old") return tA - tB;
    if(sortMode === "latestPost") return lpB - lpA;
    if(sortMode === "high") return (B.likes || 0) - (A.likes || 0);
    if(sortMode === "low") return (A.dislikes || 0) - (B.dislikes || 0);

    return 0;
  });
}

async function tryOpenThread(threadId, data) {
  if (data.locked) {
    const defaultMsg = "このスレッドは規約違反によりロックされています";
    const displayMsg = (data.lockMessage && data.lockMessage.trim() !== "") 
                       ? data.lockMessage 
                       : defaultMsg;
    showAlert(displayMsg);
    return;
  }

  if (data.password) {
    showForm('passwordFields');
    document.getElementById('popupTitle').textContent = "スレッドパスワード入力";
    document.getElementById('submitBtn').onclick = () => {
      const inputPass = document.getElementById('threadPasswordCheckInput').value.trim();
      if (inputPass === data.password) {
        closePopup();
        openThread(threadId, data);
      } else {
        showAlert("パスワードが違います");
      }
    };
  } else {
    openThread(threadId, data);
  }
}

  currentThreadId = threadId;

  currentThreadHasPassword = !!data.password;

  threadDetailElem.textContent = data.detail || "";

  threadDetailSection.style.display='block';

}

async function loadPosts(threadId) {
  showLoading("投稿を読み込み中…");

  const postList = document.getElementById("postList");
  postList.innerHTML = "";
  knownPostIds.clear();

  if (postsUnsub) postsUnsub();

  const q = query(
    collection(db, currentRoom, threadId, "posts"),
    orderBy("created_at", "asc")
  );

  postsUnsub = onSnapshot(q, async (snapshot) => {
    try {
      const docs = snapshot.docs.slice().sort((a, b) => {
        const A = a.data();
        const B = b.data();

        const ai = Number.isFinite(Number(A.index)) ? Number(A.index) : 999999999;
        const bi = Number.isFinite(Number(B.index)) ? Number(B.index) : 999999999;
        if (ai !== bi) return ai - bi;

        const at = A.created_at?.toMillis ? A.created_at.toMillis() : new Date(A.created_at || 0).getTime();
        const bt = B.created_at?.toMillis ? B.created_at.toMillis() : new Date(B.created_at || 0).getTime();
        return at - bt;
      });

      const iconIds = [...new Set(docs.map(d => d.data().icon).filter(Boolean))];
      await Promise.all(iconIds.map(id => getIconSrc(id)));

      const fragment = document.createDocumentFragment();

      for (const docItem of docs) {
        const data = docItem.data();

        let iconHtml = "";
        if (data.icon && iconCache[data.icon]) {
          iconHtml = `<img src="${iconCache[data.icon]}" style="width:24px; height:24px; border-radius:50%; vertical-align:middle; margin-right:0; object-fit:cover; background:#fff;">`;
        }

        const li = document.createElement("li");
        li.id = "post-" + (data.index || docItem.id);
        li.style.backgroundColor = data.color || "#3498db";

        li.innerHTML = `
          <span>${convertText(data.body || "")}</span>

          ${data.image ? `
            <button class="greenBtn"
              style="margin-top:6px;"
              onclick="showImagePopup('${data.image}')">
              画像を表示
            </button>
          ` : ""}

          <small style="display:flex;align-items:center;gap:3px;margin-top:5px;flex-wrap:nowrap;">
            <strong style="margin-right:6px;">#${data.index ?? "?"}</strong>
            ${renderBadge(data)}
            ${data.memberId && data.memberId === currentThreadCreatorName ? `<span style="background:#8e44ad;color:#fff;padding:2px 7px;border-radius:999px;font-size:12px;font-weight:bold;margin-right:4px;white-space:nowrap;">スレ主</span>` : ""}
            ${iconHtml}
            <span style="margin-left:0;">${data.memberId || "名称未設定"} / ${formatRelativeTime(data.created_at)}</span>
          </small>
        `;

        enableLongPressInfo(
          li,
          `【投稿情報】\n番号: ${data.index ?? "?"}\n投稿者: ${data.memberId || "名称未設定"}\n日時: ${formatDate(data.created_at)}\nIP: ${data.ip || "未取得"}`,
          {
            type: "post",
            postId: docItem.id,
            threadId,
            created_at: data.created_at,
            ip: data.ip || null
          }
        );

        fragment.appendChild(li);
      }

      postList.replaceChildren(fragment);

      const tocContainer = document.getElementById("threadToc");
      if(tocContainer) {
        tocContainer.innerHTML = "";
        tocContainer.style.display = "flex";

        const totalPosts = docs.length;
        
        for (let i = 0; i < totalPosts; i += 10) {
          const start = i + 1;
          const end = Math.min(i + 10, totalPosts);
          const btn = document.createElement("button");
          btn.className = "pageBtn";
          btn.textContent = `${start}-${end}`;
          btn.onclick = () => {
            const targetIndex = docs[i].data().index || docs[i].id;
            const el = document.getElementById("post-" + targetIndex);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          };
          tocContainer.appendChild(btn);
        }

        if (totalPosts > 0) {
          const latestBtn = document.createElement("button");
          latestBtn.className = "pageBtn";
          latestBtn.style.backgroundColor = "#e74c3c";
          latestBtn.textContent = "最新の投稿";
          latestBtn.onclick = () => {
            const lastTarget = docs[totalPosts - 1].data().index || docs[totalPosts - 1].id;
            const el = document.getElementById("post-" + lastTarget);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
          };
          tocContainer.appendChild(latestBtn);
        }
      }

      hideLoading();
    } catch (e) {
      console.error("投稿読み込みエラー:", e);
      showAlert("投稿の読み込みに失敗しました");
    }
  });
}

document.getElementById('adminBtn').onclick = async () => {
  showForm('adminFields');
  document.getElementById('popupTitle').textContent = adminLoggedIn ? "管理者メニュー" : "管理者ログイン";
  document.getElementById('submitBtn').textContent = adminLoggedIn ? "実行" : "ログイン";

  async function loadAdminLists(){
    const q = query(collection(db, currentRoom), orderBy("created_at", "desc"));
    const snap = await getDocs(q);

    threadSelect.innerHTML = "<option value=''>スレッド選択</option>";
    snap.forEach(d => {
      const data = d.data();

      threadSelect.appendChild(opt);
    });

    roomSelect.innerHTML = "<option value=''>部屋選択</option>";
    const roomSnap = await getDocs(collection(db, "rooms"));
    roomSnap.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = d.id;
      roomSelect.appendChild(opt);
    });

    bannedIpSelect.innerHTML = "<option value=''>BAN済みIP選択</option>";
    const banSnap = await getDocs(collection(db, "ipBans"));
    banSnap.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = d.id;
      bannedIpSelect.appendChild(opt);
    });
  }

  async function showAdminMenu(){
    adminLoggedIn = true;
    if(loginBox) loginBox.style.display = 'none';
    if(menuBox) menuBox.style.display = 'block';
    document.getElementById('popupTitle').textContent = "管理者メニュー";
    document.getElementById('submitBtn').textContent = "実行";
    updateAdminBadgeStatus();
    await loadAdminLists();
    setupAdminSelects();
  }

  function setupAdminSelects(){
    const radios = document.getElementsByName('adminAction');
    const toggle = () => {
      const checked = document.querySelector("input[name='adminAction']:checked");
      const val = checked ? checked.value : "single";
      threadSelect.style.display = 'block';
      postSelect.style.display = val === 'post' ? 'block' : 'none';
      roomSelect.style.display = 'none';
      ipInput.style.display = 'none';
      bannedIpSelect.style.display = 'none';

      if(val === 'deleteRoom'){
        threadSelect.style.display = 'none';
        postSelect.style.display = 'none';
        roomSelect.style.display = 'block';
      } else if(val === 'ipBan'){
        threadSelect.style.display = 'none';
        postSelect.style.display = 'none';
        ipInput.style.display = 'block';
      } else if(val === 'ipUnban'){
        threadSelect.style.display = 'none';
        postSelect.style.display = 'none';
        bannedIpSelect.style.display = 'block';
      }
    };
    radios.forEach(r => { r.onchange = toggle; });
    toggle();

    threadSelect.onchange = async () => {
      const tid = threadSelect.value;
      postSelect.innerHTML = "<option value=''>投稿選択</option>";
      if(tid){
        const psnap = await getDocs(collection(db, currentRoom, tid, "posts"));
        const docs = psnap.docs.slice().sort((a,b)=>{
          const A=a.data(), B=b.data();
          return (Number(A.index)||0) - (Number(B.index)||0);
        });
        docs.forEach(d => {
          const pdata = d.data();
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = `#${pdata.index ?? '?'} ${pdata.body ? pdata.body.slice(0, 14) : "[画像のみ]"}`;
          postSelect.appendChild(opt);
        });
      }
    };
  }

  if(adminLoggedIn){
    await showAdminMenu();
  } else {
    if(loginBox) loginBox.style.display = 'block';
    if(menuBox) menuBox.style.display = 'none';
  }

  document.getElementById('saveBadgeTextBtn').onclick = async () => {
    const text = document.getElementById('badgeTextInput').value.trim() || "📱管理者";
    localStorage.setItem("adminBadgeText", text);
    updateAdminBadgeStatus();
    await saveLog("admin_change_badge_text", { badgeText: text });
    showAlert("バッジ文字を保存しました");
  };

  document.getElementById('toggleBadgeBtn').onclick = async () => {
    const nextState = !isOfficialBadgeEnabled();
    setOfficialBadgeEnabled(nextState);
    updateAdminBadgeStatus();
    await saveLog("admin_toggle_badge", { enabled: nextState });
    showAlert(nextState ? "公式バッジをONにしました" : "公式バッジをOFFにしました");
  };

  document.getElementById('submitBtn').onclick = async () => {
    if(!adminLoggedIn){
      const pass = passInput.value;
      if(pass !== ADMIN_PASSWORD){
        showAlert("パスワードが違います");
        return;
      }
      await saveLog("admin_login_success");
      await showAdminMenu();
      return;
    }

    const checked = document.querySelector("input[name='adminAction']:checked");
    const action = checked ? checked.value : "single";
    const threadId = threadSelect.value;
    const postId = postSelect.value;
    const roomId = roomSelect.value;

    showLoading("処理中...");
    try {
      if (action === "single") {
        if (threadId) {
          const threadTitle = threadSelect.options[threadSelect.selectedIndex].textContent;
          await deleteDoc(doc(db, currentRoom, threadId));
          await saveLog("admin_delete_thread", { targetThreadId: threadId, targetThreadTitle: threadTitle });
        }
      } else if (action === "post") {
        if (threadId && postId) {
          await deleteDoc(doc(db, currentRoom, threadId, "posts", postId));
          await saveLog("admin_delete_post", { targetThreadId: threadId, targetPostId: postId });
        }
      } else if (action === "lock") {
        if (threadId) {
          const reason = window.prompt("ロックの理由を入力してください（空欄の場合はデフォルトの文章になります）");
          await updateDoc(doc(db, currentRoom, threadId), { locked: true, lockMessage: reason || "" });
          await saveLog("admin_lock_thread", { targetThreadId: threadId, reason: reason || "" });
        }
      } else if (action === "unlock") {
        if (threadId) {
          await updateDoc(doc(db, currentRoom, threadId), { locked: false, lockMessage: "" });
          await saveLog("admin_unlock_thread", { targetThreadId: threadId });
        }
      } else if (action === "pin") {
        if (threadId) {
          await updateDoc(doc(db, currentRoom, threadId), { pinned: true });
          await saveLog("admin_pin_thread", { targetThreadId: threadId });
        }
      } else if (action === "unpin") {
        if (threadId) {
          await updateDoc(doc(db, currentRoom, threadId), { pinned: false });
          await saveLog("admin_unpin_thread", { targetThreadId: threadId });
        }
      } else if (action === "deleteRoom") {
        if (roomId) {
          await deleteDoc(doc(db, "rooms", roomId));
          const snap = await getDocs(collection(db, roomId));
          for (const d of snap.docs) await deleteDoc(doc(db, roomId, d.id));
          await saveLog("admin_delete_room", { targetRoomId: roomId });
          if (roomId === currentRoom) switchRoom("threads");
        }
      } else if (action === "ipBan") {
        const ip = ipInput.value.trim();
        if (!ip) { showAlert("BANするIPを入力してください"); return; }
        await setDoc(doc(db, "ipBans", ip), { ip, banned_at: Timestamp.now() });
        await saveLog("admin_ip_ban", { targetIp: ip });
      } else if (action === "ipUnban") {
        const ip = bannedIpSelect.value;
        if (!ip) { showAlert("解除するIPを選択してください"); return; }
        await deleteDoc(doc(db, "ipBans", ip));
        await saveLog("admin_ip_unban", { targetIp: ip });
      }
      closePopup();
      hideLoading();
    } catch (e) {
      console.error(e);
      showAlert("エラー");
    }
  };
};

function loadAllThreads(){
  if (isAllLoaded) return;

  showLoading("すべてのスレッドを読み込み中...");

  if (threadsUnsub) threadsUnsub();
  if (pinnedUnsub) { pinnedUnsub(); pinnedUnsub = null; }

  let isInitialLoadAll = true;

  const q = query(
    collection(db, currentRoom),
    orderBy("created_at", "desc")
  );

  threadsUnsub = onSnapshot(q, snapshot => {
    if (!isInitialLoadAll) {
      snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
          const newThread = change.doc.data();
          showTopNotification(`新しいスレッド「${newThread.title}」が作成されました`);
        }
      });
    }
    isInitialLoadAll = false;

    threadsData = snapshot.docs.map(d => {
      const data = d.data();
      return { id: d.id, data: () => data };
    });

    isAllLoaded = true;

    applySort();
    renderThreadsPage();
    hideLoading();
  });
}

  e.stopPropagation();
  const isShow = quickMenuContent.style.display === "block";
  quickMenuContent.style.display = isShow ? "none" : "block";
};

document.addEventListener("click", () => {
  quickMenuContent.style.display = "none";
});

document.querySelectorAll(".quickItem").forEach(item => {
  item.onclick = () => {
    quickPostInput.value = item.textContent;
    quickMenuContent.style.display = "none";
    document.getElementById("quickSendBtn").click();
  };
});

// クイック送信（体感0秒 UI）
let isQuickSending = false;
document.getElementById("quickSendBtn").onclick = async () => {
  if (isQuickSending) return;
  if(await stopIfBanned()) return;
  const clientIP = await getClientIP();
  const input = document.getElementById("quickPostInput");
  const text = input.value.trim();
  if (!text) return;
  if (containsNGWord(text)) {
    showAlert("本文に使えない言葉が含まれています");
    return;
  }
  
  isQuickSending = true;
  input.value = ""; // 入力欄を即時リセット

  // --- 【体感0秒処理】画面に即時反映 ---
  const postList = document.getElementById("postList");
  let index = postList.children.length + 1; 
  let iconId = getCookie("iconId");

  const tempLi = document.createElement("li");
  tempLi.style.backgroundColor = "#3498db";
  tempLi.style.opacity = "0.6"; // 送信中表現
  tempLi.innerHTML = `
    <span>${convertText(text)}</span>
    <small style="display:flex;align-items:center;gap:3px;margin-top:5px;flex-wrap:nowrap;">
      <strong style="margin-right:6px;">#${index}</strong>
      <span style="margin-left:0;">${nickName} / 送信中...</span>
    </small>
  `;
  postList.appendChild(tempLi);
  tempLi.scrollIntoView({ behavior: "smooth", block: "center" });

  // --- バックグラウンド送信 ---
  (async () => {
    try {
      const newPost = await addDoc(
        collection(db, currentRoom, currentThreadId, "posts"),
        {
          memberId: nickName,
          body: text,
          color: "#3498db",
          icon: iconId || null,
          created_at: Timestamp.now(),
          ip: clientIP,
          index,
          ...getPostBadgeData(),
          ...getBoardWriteMeta()
        }
      );

      await updateDoc(doc(db, currentRoom, currentThreadId), {
        postCount: increment(1),
        latestPostTime: serverTimestamp()
      });

      await saveLog("quick_send_post", { 
        threadId: currentThreadId, 
        threadTitle: currentThreadTitle,
        postId: newPost.id, 
        index: index, 
        text: text
      });
    } catch (e) {
      console.error(e);
      showAlert(isOldBoardHtmlError(e)
        ? "このHTMLは古いため投稿できません。最新版のしんぞボードを開いてください。"
        : "送信に失敗しました");
      tempLi.remove();
    } finally {
      isQuickSending = false;
    }
  })();
};
</script>

</html>
